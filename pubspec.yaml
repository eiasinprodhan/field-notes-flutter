name: field_notes_app
description: Offline-first Field Notes app for field workers (ATI Limited take-home).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  geolocator: ^10.1.0
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
